be: {name: Belarusian, fasttext: be, len_ratio: [0.6, 1.8], wmt26: bel_Cyrl}
kk: {name: Kazakh,     fasttext: kk, len_ratio: [0.6, 1.8], wmt26: kaz_Cyrl}
et: {name: Estonian,   fasttext: et, len_ratio: [0.6, 1.8], wmt26: ekk_Latn}
